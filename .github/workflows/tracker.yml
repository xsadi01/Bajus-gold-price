name: Gold Price Auto Tracker

on:
  schedule:
    # প্রতি মিনিটে রান হওয়ার কমান্ড (GitHub এর সার্ভার লোড অনুযায়ী ১-৫ মিনিট দেরি হতে পারে)
    - cron: '*/1 * * * *'
  workflow_dispatch: # চাইলে ম্যানুয়ালি রান করার জন্য

jobs:
  update-price:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow firebase-admin pytz requests

      - name: Run Python script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python main.py # আপনার মূল পাইথন ফাইলের নাম main.py না হলে সেটি পরিবর্তন করে দিন

      - name: Commit and push generated images & JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_price.json *.png
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update price images and last price" && git push)
